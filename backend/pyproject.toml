[project]
name = "bytasm"
version = "0.0.1"
description = "Local-first static binary-analysis workbench (in development; fixtures-only)."
requires-python = ">=3.12"
authors = [{ name = "Bytasm contributors" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "lief>=1.0.0,<1.1",
]

[project.scripts]
bytasm = "bytasm.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bytasm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax,
# S: security checks (bandit rules), SIM: simplifications.
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and run the CLI via subprocess with fixed argv lists.
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
