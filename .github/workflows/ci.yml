name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      # CI never rebuilds fixtures; it checks the committed bytes.
      - name: Verify fixture manifest
        working-directory: fixtures
        run: sha256sum --check --strict MANIFEST.sha256

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy

      - name: Tests (pytest)
        run: uv run --no-sync pytest

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint (eslint, incl. the dangerouslySetInnerHTML ban)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Install locked dependencies
        run: |
          uv --directory backend sync --locked
          npm --prefix frontend ci

      - name: Install the pinned Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Starts two `bytasm serve` processes on 127.0.0.1 with throwaway data
      # directories; only committed fixtures and generated bytes are imported.
      - name: Playwright tests
        run: make e2e

  audit:
    name: Dependency audit (pip-audit, npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      # No install step: pip-audit runs from its own locked group in an
      # isolated environment, and npm audit reads package-lock.json.
      - name: Audit locked dependencies
        run: make audit

  compose:
    name: Compose smoke test (container checks, demo)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      # backend/.venv for compose-check and the demo client; frontend/node_modules
      # for the UI build that the image serves.
      - name: Install locked dependencies
        run: |
          uv --directory backend sync --locked
          npm --prefix frontend ci

      - name: Check the Compose security settings
        run: make compose-check

      # Builds the UI and the image, then `docker compose up --wait`.
      - name: Build and start the container
        run: make compose-up

      - name: Wait for /api/v1/health
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8000/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Bytasm did not become healthy on 127.0.0.1:8000" >&2
          exit 1

      - name: Check the running container's settings
        run: ./scripts/check-container.sh

      - name: Demo against the container
        run: make demo DEMO_ARGS="--url http://127.0.0.1:8000"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the container
        if: always()
        run: make compose-down
