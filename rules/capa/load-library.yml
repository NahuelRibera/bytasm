rule:
  meta:
    name: load library via Windows API
    namespace: load-code/library
    authors:
      - Bytasm contributors
    scopes:
      static: function
      dynamic: unsupported
    description: Static API-call feature; ordinary applications may use this API. Does not prove runtime behavior or malicious intent.
  features:
    - or:
      - api: kernel32.LoadLibrary
      - api: kernel32.LoadLibraryEx
